function render(){
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.title=t("name");
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $("lang").textContent=L=="ar"?"English":"عربي";$("introName").textContent=t("name");
 const S=t("svcs"),pr=i=>prices[i]??P0[i];
 $("svc").innerHTML=G.map((g,k)=>`<div class="grp"><h3>${t("grp")[k]}</h3>`+g.map(i=>`<div class="row"><span>${S[i]}</span><i></i><b>${t("from")} ${pr(i)} ${t("egp")}</b></div>`).join("")+`</div>`).join("");
 $("st").innerHTML=t("steps").map(x=>`<div class="st"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");
 $("fq").innerHTML=t("faq").map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("");
 const cur=$("fs").value;$("fs").innerHTML=S.map((n,i)=>`<option value="${i}">${n}</option>`).join("");if(cur)$("fs").value=cur;
 const cp=$("cap");if(cp)cp.textContent=t("cap");
 nextSlot();drawSlots();drawDash()}
function arch(){const svg=$("arch");let h='<line class="mid" x1="200" y1="40" x2="200" y2="320"/>';
 const rows=[[[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],100,1],[[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38],250,-1]];
 const W=n=>{n%=10;return(n>=6?26:n>=4?19:n==3?17:15)*.92},H=n=>{n%=10;return n>=6?36:n>=4?40:n==3?48:44};
 rows.forEach(([ns,y0,f])=>{const ws=ns.map(W),tot=ws.reduce((a,b)=>a+b)+45;let x=200-tot/2;
  ns.forEach((n,i)=>{const w=ws[i],cx=x+w/2;x+=w+3;const dx=(cx-200)/200,cy=y0+f*18*dx*dx,a=f*dx*16;
   h+=`<g class="t" data-n="${n}" transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${a.toFixed(1)})"><rect x="${-w/2}" y="${-H(n)/2}" width="${w.toFixed(1)}" height="${H(n)}" rx="${(w*.38).toFixed(1)}"/></g>`})});
 h+='<text id="cap" x="200" y="178">'+t("cap")+'</text><text class="sub" id="sub" x="200" y="200">FDI</text>';
 svg.innerHTML=h;svg.querySelectorAll(".t").forEach(g=>{g.onmouseenter=()=>{$("cap").textContent=g.dataset.n;$("sub").textContent=t("cap")};g.onmouseleave=()=>{$("cap").textContent=t("cap");$("sub").textContent="FDI"}})}
function nextSlot(){const el=$("nx");const now=new Date();
 for(let k=0;k<21;k++){const d=new Date(now.getTime()+k*864e5);if(d.getDay()==5)continue;
  const ds=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const hm=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2);
  const tm=TIMES.find(x=>!taken[ds+"_"+x]&&(k>0||x>hm));
  if(tm){const lab=k==0?t("today"):k==1?t("tom"):d.toLocaleDateString(L=="ar"?"ar-EG":"en-GB",{weekday:"long",day:"numeric",month:"long"});
   el.innerHTML=`<div><small>${t("next")}</small><br><strong>${lab} – ${tm}</strong></div><button id="nxb">${t("nxBtn")}</button>`;
   $("nxb").onclick=()=>{$("fd").value=ds;sel=tm;drawSlots();location.hash="book"};return}}}
function drawSlots(){const d=$("fd").value;$("slots").innerHTML=d?TIMES.map(x=>`<button type="button" class="slot ${sel==x?"on":""}" data-t="${x}" ${taken[d+"_"+x]?"disabled":""}>${x}</button>`).join(""):"";
 $("slots").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=b.dataset.t;drawSlots()})}
function drawDash(){
 $("login").hidden=unlocked;$("dashbox").hidden=!unlocked;if(!unlocked)return;
 $("locked").hidden=canEdit;$("dashin").hidden=!canEdit;if(!canEdit)return;
 appts=raw.map(a=>({...a,status:st[a.id]||"pending"}));
 const today=new Date().toISOString().slice(0,10),c=s=>appts.filter(a=>a.status==s).length;
 const rev=appts.filter(a=>a.status=="completed").reduce((s,a)=>s+(prices[a.svc]??P0[a.svc]),0);
 const K=[["kTot",appts.length],["kPen",c("pending")],["kToday",appts.filter(a=>a.date==today).length],["kDone",c("completed")],["kNo",c("no_show")],["kRev",rev]];
 $("kpis").innerHTML=K.map(([k,v])=>`<div class="fig"><b>${v}</b><span>${t(k)}</span></div>`).join("");
 $("at").innerHTML=`<tr><th>ID</th><th>${t("fName")}</th><th>${t("fPhone")}</th><th>${t("fSvc")}</th><th>${t("fDate")}</th><th></th></tr>`+appts.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr><td>${a.id.slice(0,6)}</td><td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td>${t("svcs")[a.svc]}</td><td>${a.date} ${a.time}</td><td><span class="tag">${t(a.status)}</span> ${acts(a)}</td></tr>`).join("");
 $("at").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>setSt(b.dataset.id,b.dataset.a));
 if(!$("pe").children.length||$("pe").dataset.l!=L){$("pe").dataset.l=L;$("pe").innerHTML=t("svcs").map((n,i)=>`<div class="pe"><span>${n}</span><input type="number" min="0" id="pi${i}" value="${prices[i]??P0[i]}"><button class="sm" data-p="${i}">${t("save")}</button></div>`).join("");
  $("pe").querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const v=+$("pi"+b.dataset.p).value;if(v>=0)await db.doc("prices/p"+b.dataset.p).set({v})})}}
function acts(a){const b=(k,l)=>`<button class="sm" data-a="${k}" data-id="${a.id}">${t(l)}</button> `;
 return a.status=="pending"?b("confirmed","ok2")+b("cancelled","rej"):a.status=="confirmed"?b("completed","done")+b("no_show","ns")+b("cancelled","rej"):""}
async function setSt(id,status){const a=appts.find(x=>x.id==id);await db.doc("status/"+id).set({status});
 if((status=="cancelled"||status=="no_show")&&a)await db.doc("slots/"+a.date+"_"+a.time).delete()}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
$("go").onclick=async()=>{try{if(await sha($("pw").value)==PWH){unlocked=true;$("pw").value="";$("lm").textContent="";try{sessionStorage.setItem("u","1")}catch(e){}drawDash()}else $("lm").textContent=t("bad")}catch(e){$("lm").textContent=t("bad")}};
$("pw").onkeydown=e=>{if(e.key=="Enter")$("go").click()};
$("out").onclick=()=>{unlocked=false;try{sessionStorage.removeItem("u")}catch(e){}drawDash()};
$("lang").onclick=()=>{L=L=="ar"?"en":"ar";render()};
$("fd").min=new Date().toISOString().slice(0,10);$("fd").onchange=()=>{sel=null;drawSlots()};
$("sub").onclick=async()=>{
 const m=$("msg"),d=$("fd").value,n=$("fn").value.trim(),p=$("fp").value.trim();
 if(!db){m.textContent=t("nodb");return}
 if(!d||!sel||n.length<2||!/^[0-9+ ]{8,15}$/.test(p)){m.textContent=t("need");return}
 const sr=db.doc("slots/"+d+"_"+sel);
 try{const lease=await sr.acquire({ttlMs:8000});
  if(!lease.acquired||(await sr.get()).exists){m.textContent=t("taken");return}
  const id=crypto.randomUUID();await sr.set({booked:true});
  const ar=db.doc("appointments/"+uid),cur=await ar.get(),old=cur.exists?cur.data():{};
  old[id]={name:n,phone:p,svc:+$("fs").value,date:d,time:sel,note:$("fnote").value,at:Date.now()};await ar.set(old);
  m.textContent=t("ok")+" "+id.slice(0,8).toUpperCase();sel=null;$("fn").value=$("fp").value=$("fnote").value="";
 }catch(e){m.textContent=t("taken")}};
try{unlocked=sessionStorage.getItem("u")=="1"}catch(e){}
$("introImg").src=IMG;$("heroImg").src=IMG;$("hdrImg").src=ICO;
addEventListener("hashchange",route);render();route();
setTimeout(()=>{$("intro").style.opacity=0;setTimeout(()=>$("intro").remove(),700)},2200);
(async()=>{
 try{const u=await claude.use("user");canEdit=!!(u&&u.canEdit());
  db=await claude.use("db");if(!db)return;uid=await u.id();
  db.collection("prices").onSnapshot(s=>{prices={};s.docs.forEach(x=>prices[+x.id.slice(1)]=x.data().v);$("pe").innerHTML="";render()});
  db.collection("slots").onSnapshot(s=>{taken={};s.docs.forEach(x=>taken[x.id]=1);drawSlots();nextSlot()});
  if(canEdit){db.collection("appointments").onSnapshot(s=>{raw=s.docs.flatMap(x=>Object.entries(x.data()).map(([id,v])=>({id,...v})));drawDash()});
   db.collection("status").onSnapshot(s=>{st={};s.docs.forEach(x=>st[x.id]=x.data().status);drawDash()})}
  render();
 }catch(e){}
})();
</script>
</body>
